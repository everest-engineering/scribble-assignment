openapi: 3.0.3
info:
  title: Scribble Round Results and Restart API
  version: 1.0.0
  description: REST contract for ended-round result polling and Host-only restart.
servers:
  - url: http://localhost:3001
paths:
  /rooms/{code}:
    get:
      summary: Fetch current viewer-specific room snapshot
      operationId: getRoom
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - name: participantId
          in: query
          required: false
          schema:
            type: string
          description: Viewer participant id used for role-specific UI state.
      responses:
        "200":
          description: Current room snapshot including round results when available
          content:
            application/json:
              schema:
                type: object
                required:
                  - room
                properties:
                  room:
                    $ref: "#/components/schemas/RoomSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /rooms/{code}/join:
    post:
      summary: Join an existing room only while it is in lobby state
      operationId: joinRoom
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomRequest"
      responses:
        "200":
          description: Player joined the lobby
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Room is not accepting new players while playing or showing results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{code}/restart:
    post:
      summary: Restart from round results back to lobby
      operationId: restartGame
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartGameRequest"
      responses:
        "200":
          description: Host restarted the room to lobby with membership preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomCommandResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Room is not currently showing round results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{code}/round/draw:
    post:
      summary: Add a drawing mark only during active round play
      operationId: addDrawingMark
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "409":
          description: Round has ended and drawing can no longer change results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{code}/round/clear:
    post:
      summary: Clear the canvas only during active round play
      operationId: clearCanvas
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "409":
          description: Round has ended and clearing can no longer change results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{code}/round/guess:
    post:
      summary: Submit a guess only during active round play
      operationId: submitGuess
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "409":
          description: Round has ended and guesses can no longer change results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    RoomCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 4
        maxLength: 4
        pattern: "^[A-Z0-9]{4}$"
      description: Case-insensitive room code. Clients may submit lowercase; server normalizes to uppercase.
  responses:
    BadRequest:
      description: Invalid request input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Participant is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Room or participant not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    JoinRoomRequest:
      type: object
      required:
        - playerName
      properties:
        playerName:
          type: string
          minLength: 1
          description: Player display name after trimming.
    RestartGameRequest:
      type: object
      required:
        - participantId
      properties:
        participantId:
          type: string
    RoomSessionResponse:
      type: object
      required:
        - participantId
        - room
      properties:
        participantId:
          type: string
        room:
          $ref: "#/components/schemas/RoomSnapshot"
    RoomCommandResponse:
      type: object
      required:
        - room
      properties:
        room:
          $ref: "#/components/schemas/RoomSnapshot"
        message:
          type: string
    RoomSnapshot:
      type: object
      required:
        - code
        - status
        - participants
        - currentRound
        - roundResult
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 4
        status:
          type: string
          enum:
            - lobby
            - playing
            - results
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantSnapshot"
        currentRound:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActiveRoundSnapshot"
        roundResult:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RoundResult"
    ParticipantSnapshot:
      type: object
      required:
        - id
        - name
        - joinedAt
        - isHost
      properties:
        id:
          type: string
        name:
          type: string
        joinedAt:
          type: string
          format: date-time
        isHost:
          type: boolean
        isDrawer:
          type: boolean
        score:
          type: number
    ActiveRoundSnapshot:
      type: object
      required:
        - number
        - drawerParticipantId
      properties:
        number:
          type: integer
          minimum: 1
        drawerParticipantId:
          type: string
        secretWord:
          type: string
          description: Present only when the viewer is the assigned drawer during active play.
    RoundResult:
      type: object
      required:
        - roundNumber
        - drawerParticipantId
        - correctWord
        - finalScores
        - guessHistory
        - endedAt
      properties:
        roundNumber:
          type: integer
          minimum: 1
        drawerParticipantId:
          type: string
        correctWord:
          type: string
        finalScores:
          type: array
          items:
            $ref: "#/components/schemas/FinalScore"
        guessHistory:
          type: array
          items:
            $ref: "#/components/schemas/Guess"
        endedAt:
          type: string
          format: date-time
    FinalScore:
      type: object
      required:
        - participantId
        - name
        - score
      properties:
        participantId:
          type: string
        name:
          type: string
        score:
          type: number
    Guess:
      type: object
      required:
        - id
        - participantId
        - participantName
        - text
        - isCorrect
        - pointsAwarded
        - submittedAt
      properties:
        id:
          type: string
        participantId:
          type: string
        participantName:
          type: string
        text:
          type: string
        isCorrect:
          type: boolean
        pointsAwarded:
          type: number
        submittedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
